name: Build CurrentSense iOS (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - "CurrentSense/**"
      - "Tests/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Run magnetic anomaly detector regression tests
        run: |
          swiftc \
            CurrentSense/CurrentSense/MagneticAnomalyDetector.swift \
            Tests/MagneticAnomalyDetectorTests.swift \
            -o "$RUNNER_TEMP/MagneticAnomalyDetectorTests"
          "$RUNNER_TEMP/MagneticAnomalyDetectorTests"

      - name: Verify Xcode toolchain and project
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -list -project CurrentSense/CurrentSense.xcodeproj

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project CurrentSense/CurrentSense.xcodeproj \
            -scheme CurrentSense \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CurrentSenseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA for later signing
        run: |
          APP_PATH="$RUNNER_TEMP/CurrentSenseDerivedData/Build/Products/Release-iphoneos/CurrentSense.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/CurrentSense.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/CurrentSense-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/CurrentSense-unsigned.ipa"

      - name: Verify IPA structure and executable
        run: |
          set -euo pipefail
          IPA_PATH="$GITHUB_WORKSPACE/CurrentSense-unsigned.ipa"
          APP_PATH="$RUNNER_TEMP/CurrentSenseDerivedData/Build/Products/Release-iphoneos/CurrentSense.app"

          unzip -t "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" > "$RUNNER_TEMP/ipa-entries.txt"
          grep -Fxq "Payload/CurrentSense.app/Info.plist" "$RUNNER_TEMP/ipa-entries.txt"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          PACKAGE_TYPE=$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$APP_PATH/Info.plist")
          test "$PACKAGE_TYPE" = "APPL"
          test -n "$EXECUTABLE"
          test -x "$APP_PATH/$EXECUTABLE"
          grep -Fxq "Payload/CurrentSense.app/$EXECUTABLE" "$RUNNER_TEMP/ipa-entries.txt"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: CurrentSense-unsigned-IPA
          path: CurrentSense-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
