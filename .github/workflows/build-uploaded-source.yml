name: Build CurrentSense iOS (source ZIP or repository fallback)

on:
  workflow_dispatch:
  push:
    paths:
      - "CurrentSense-source.zip"
      - ".github/workflows/build-uploaded-source.yml"

permissions:
  contents: read

concurrency:
  group: currentsense-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MARKETING_VERSION: "1.0.0"
      BUNDLE_ID: "com.currentsense.app"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect source input
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$GITHUB_WORKSPACE/CurrentSense-source.zip" ]]; then
            echo "SOURCE_MODE=uploaded" >> "$GITHUB_ENV"
            echo "source_mode=uploaded" >> "$GITHUB_OUTPUT"
            echo "Found CurrentSense-source.zip; building the uploaded project."
            unzip -t "$GITHUB_WORKSPACE/CurrentSense-source.zip" | tail -n 2
          else
            echo "SOURCE_MODE=repository-fallback" >> "$GITHUB_ENV"
            echo "source_mode=repository-fallback" >> "$GITHUB_OUTPUT"
            echo "::warning title=Source ZIP absent::CurrentSense-source.zip is not committed. Building the existing checked-in CurrentSense project instead, so this run can still produce an IPA."
            test -f "$GITHUB_WORKSPACE/CurrentSense/CurrentSense.xcodeproj/project.pbxproj"
          fi

      - name: Record Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version
          sw_vers

      - name: Extract uploaded project
        if: steps.source.outputs.source_mode == 'uploaded'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PARENT="$RUNNER_TEMP/currentsense-unpacked"
          mkdir -p "$SOURCE_PARENT"
          unzip -q CurrentSense-source.zip -d "$SOURCE_PARENT"
          SOURCE_DIR="$SOURCE_PARENT/CurrentSense"
          test -f "$SOURCE_DIR/project.yml"
          test -f "$SOURCE_DIR/CurrentSense/Info.plist"
          test -f "$SOURCE_DIR/Packages/CurrentSenseCore/Package.swift"
          chmod +x "$SOURCE_DIR"/scripts/*.sh
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Install XcodeGen for uploaded project
        if: steps.source.outputs.source_mode == 'uploaded'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Run uploaded source core tests
        if: steps.source.outputs.source_mode == 'uploaded'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/currentsense-logs"
          cd "$SOURCE_DIR/Packages/CurrentSenseCore"
          swift test 2>&1 | tee "$RUNNER_TEMP/currentsense-logs/swift-test.log"

      - name: Run checked-in source regression tests
        if: steps.source.outputs.source_mode == 'repository-fallback'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/currentsense-logs"
          {
            swiftc CurrentSense/CurrentSense/MagneticAnomalyDetector.swift Tests/MagneticAnomalyDetectorTests.swift -o "$RUNNER_TEMP/MagneticAnomalyDetectorTests"
            "$RUNNER_TEMP/MagneticAnomalyDetectorTests"
            swiftc CurrentSense/CurrentSense/CurrentEstimateCalculator.swift Tests/CurrentEstimateCalculatorTests.swift -o "$RUNNER_TEMP/CurrentEstimateCalculatorTests"
            "$RUNNER_TEMP/CurrentEstimateCalculatorTests"
            swiftc CurrentSense/CurrentSense/FieldToneMapping.swift Tests/FieldToneMappingTests.swift -o "$RUNNER_TEMP/FieldToneMappingTests"
            "$RUNNER_TEMP/FieldToneMappingTests"
            swiftc CurrentSense/CurrentSense/ACFieldScanClassifier.swift Tests/ACFieldScanClassifierTests.swift -o "$RUNNER_TEMP/ACFieldScanClassifierTests"
            "$RUNNER_TEMP/ACFieldScanClassifierTests"
          } 2>&1 | tee "$RUNNER_TEMP/currentsense-logs/swift-test.log"

      - name: Generate uploaded Xcode project
        if: steps.source.outputs.source_mode == 'uploaded'
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          xcodegen generate
          xcodebuild -list -project CurrentSense.xcodeproj

      - name: Verify checked-in Xcode project
        if: steps.source.outputs.source_mode == 'repository-fallback'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project CurrentSense/CurrentSense.xcodeproj

      - name: Run uploaded project UI tests on iPhone simulator
        if: steps.source.outputs.source_mode == 'uploaded'
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          mkdir -p build
          UDID="$(scripts/pick_simulator.sh)"
          test -n "$UDID" || { echo "No available iPhone simulator found"; exit 1; }
          echo "Selected simulator: $UDID"
          xcodebuild test \
            -project CurrentSense.xcodeproj \
            -scheme CurrentSense \
            -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/CurrentSense-UI-Tests.xcresult" \
            CS_SOURCE_REVISION="$GITHUB_SHA" \
            2>&1 | tee "$RUNNER_TEMP/currentsense-logs/ui-tests.log" | tail -n 80

      - name: Build, package, and verify iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/currentsense-logs" "$RUNNER_TEMP/currentsense-release"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "$SOURCE_MODE" == "uploaded" ]]; then
            cd "$SOURCE_DIR"
            IPA="$RUNNER_TEMP/currentsense-release/CurrentSense-${MARKETING_VERSION}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}-unsigned.ipa"
            xcodebuild archive \
              -project CurrentSense.xcodeproj \
              -scheme CurrentSense \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/CurrentSense.xcarchive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              CS_SOURCE_REVISION="$GITHUB_SHA" \
              2>&1 | tee "$RUNNER_TEMP/currentsense-logs/archive.log" | tail -n 80
            scripts/package_ipa.sh build/CurrentSense.xcarchive "$IPA"
            scripts/verify_ipa.sh "$IPA" "$BUNDLE_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" \
              | tee "$RUNNER_TEMP/currentsense-logs/ipa-verify.log"
          else
            APP_PATH="$RUNNER_TEMP/CurrentSenseDerivedData/Build/Products/Release-iphoneos/CurrentSense.app"
            IPA="$RUNNER_TEMP/currentsense-release/CurrentSense-repository-fallback-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}-unsigned.ipa"
            xcodebuild \
              -project CurrentSense/CurrentSense.xcodeproj \
              -scheme CurrentSense \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/CurrentSenseDerivedData" \
              MARKETING_VERSION=0.3.0 \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee "$RUNNER_TEMP/currentsense-logs/archive.log" | tail -n 80
            test -d "$APP_PATH"
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/CurrentSense.app"
            (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$IPA" Payload)
            unzip -t "$IPA" | tee "$RUNNER_TEMP/currentsense-logs/ipa-verify.log"
            unzip -Z1 "$IPA" > "$RUNNER_TEMP/ipa-entries.txt"
            grep -Fxq "Payload/CurrentSense.app/Info.plist" "$RUNNER_TEMP/ipa-entries.txt"
            EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
            PACKAGE_TYPE=$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$APP_PATH/Info.plist")
            test "$PACKAGE_TYPE" = "APPL"
            test -n "$EXECUTABLE"
            test -x "$APP_PATH/$EXECUTABLE"
            grep -Fxq "Payload/CurrentSense.app/$EXECUTABLE" "$RUNNER_TEMP/ipa-entries.txt"
            echo "Verified IPA structure. Source mode: repository fallback (committed source, not the missing ZIP)."
          fi
          test -s "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Write build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/currentsense-report"
          {
            printf '# CurrentSense iOS build report\n\n'
            printf -- '- Source mode: %s\n' "${SOURCE_MODE:-unknown}"
            printf -- '- Repository: %s\n' "$GITHUB_REPOSITORY"
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- Signing: unsigned; a valid signing identity and provisioning profile are required for installation on a physical iPhone.\n'
            if [[ "${SOURCE_MODE:-}" == "repository-fallback" ]]; then
              printf '\n**Important:** the uploaded source ZIP was absent; this artifact was built from the source already committed in the repository.\n'
            fi
            printf -- '\n- Physical iPhone sensor validation: not performed by CI.\n'
            if [[ -f "$RUNNER_TEMP/currentsense-logs/swift-test.log" ]]; then
              printf '\n## Test log summary\n\n'
              tail -n 25 "$RUNNER_TEMP/currentsense-logs/swift-test.log"
            fi
            if [[ -f "$RUNNER_TEMP/currentsense-logs/ipa-verify.log" ]]; then
              printf '\n## IPA verification\n\n'
              tail -n 20 "$RUNNER_TEMP/currentsense-logs/ipa-verify.log"
            fi
          } > "$RUNNER_TEMP/currentsense-report/release-report.md"

      - name: Upload iPhone IPA artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: CurrentSense-iPhone-unsigned-IPA-b${{ github.run_number }}
          path: |
            ${{ runner.temp }}/currentsense-release/*.ipa
            ${{ runner.temp }}/currentsense-report/release-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CurrentSense-build-logs-b${{ github.run_number }}
          path: |
            ${{ runner.temp }}/currentsense-logs/*.log
            ${{ runner.temp }}/currentsense-report/release-report.md
            ${{ runner.temp }}/CurrentSense-UI-Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14
