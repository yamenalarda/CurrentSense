name: CurrentSense
options:
  bundleIdPrefix: com.currentsense
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CurrentSenseCore:
    path: Packages/CurrentSenseCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CS_SOURCE_REVISION: "local"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  CurrentSense:
    type: application
    platform: iOS
    sources:
      - CurrentSense
    dependencies:
      - package: CurrentSenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currentsense.app
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    info:
      path: CurrentSense/Info.plist
      properties:
        CFBundleDisplayName: CurrentSense
        CSSourceRevision: $(CS_SOURCE_REVISION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - magnetometer
  CurrentSenseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CurrentSenseUITests
    dependencies:
      - target: CurrentSense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currentsense.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CurrentSense:
    build:
      targets:
        CurrentSense: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CurrentSenseUITests
    archive:
      config: Release
